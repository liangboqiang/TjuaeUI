name: ❓ 使用咨询
description: 咨询有关 TjuaeUI 的问题
title: '[咨询] '
labels: ['question']
body:
  - type: dropdown
    id: module
    attributes:
      label: 模块
      description: 此问题属于哪个模块？
      options:
        - Agent 检测与连接
        - 助手与预设
        - 模型与认证
        - MCP 与工具
        - 技能与插件
        - 渠道集成
        - 会话与上下文
        - 搜索与历史
        - 项目、文件与预览
        - WebUI 与远程访问
        - 定时任务
        - Team 协作
        - 界面与显示
        - 系统设置
        - 其他
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 问题
      description: 你想了解什么？
      placeholder: 请在此填写问题……
    validations:
      required: true

  - type: dropdown
    id: question_category
    attributes:
      label: 问题分类
      description: 此问题属于哪种类型？
      options:
        - 安装与初始化
        - 配置
        - 使用与功能
        - 故障排查
        - 开发
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 请说明问题背景以及你想实现的目标。
      placeholder: 请描述你正在尝试完成或理解的事情……

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 你正在使用哪个平台？
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - 不适用
