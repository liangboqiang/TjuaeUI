name: 🐛 缺陷报告
description: 报告 TjuaeUI 中的缺陷或异常行为
title: '[缺陷] '
labels: ['bug']
body:
  - type: dropdown
    id: module
    attributes:
      label: 模块
      description: 此问题属于哪个模块？
      options:
        - Agent 检测与连接
        - 助手与预设
        - 模型与认证
        - MCP 与工具
        - 技能与插件
        - 渠道集成
        - 会话与上下文
        - 搜索与历史
        - 项目、文件与预览
        - WebUI 与远程访问
        - 定时任务
        - Team 协作
        - 界面与显示
        - 系统设置
        - 其他
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 你正在使用哪个平台？
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TjuaeUI 版本
      description: 你正在使用哪个 TjuaeUI 版本？
      placeholder: 例如 1.2.2
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: 问题描述
      description: 请清晰、简洁地描述问题。
      placeholder: 请描述发生了什么……
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 复现步骤
      description: 请列出复现问题的步骤。
      placeholder: |
        1. 打开“……”
        2. 点击“……”
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为
      description: 正常情况下应该发生什么？
      placeholder: 请描述预期结果。
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: 请描述实际结果。
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 请补充其他有助于定位问题的信息。
      placeholder: 截图、错误日志等。
