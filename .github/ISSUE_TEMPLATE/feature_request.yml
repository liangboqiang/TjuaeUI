name: ✨ 功能建议
description: 为 TjuaeUI 提出功能建议
title: '[功能] '
labels: ['enhancement']
body:
  - type: textarea
    id: feature_description
    attributes:
      label: 功能说明
      description: 请清晰、简洁地描述你希望增加的功能。
      placeholder: 请描述你期望的功能……
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: 问题背景
      description: 此功能要解决什么问题？
      placeholder: 请描述当前遇到的问题或限制。
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: 建议方案
      description: 请描述你期望实现的方案。
      placeholder: 你希望此功能如何工作？
    validations:
      required: true

  - type: dropdown
    id: feature_category
    attributes:
      label: 功能分类
      description: 此功能属于哪个分类？
      options:
        - UI/UX 改进
        - AI 模型集成
        - 文件管理
        - 多 Agent 支持
        - 性能
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 请补充其他有助于理解此建议的信息。
      placeholder: 使用场景、示例、原型等。
