name: Issue 分类

# 根据 Issue 模板中的“模块”下拉选项，为新 Issue 自动添加标签并分配负责人。
# 映射位于 .github/triage-map.json；负责人只需在那里修改。
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/triage-map.json
          sparse-checkout-cone-mode: false

      - name: 按模块添加标签并分配负责人
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const map = JSON.parse(fs.readFileSync('.github/triage-map.json', 'utf8'));
            const issue = context.payload.issue;
            const issue_number = issue.number;
            const body = issue.body || '';

            // Issue Form 下拉项会渲染为“### <字段标签>\n\n<选中值>”。
            // 只提取“模块”标题下的值并精确匹配，避免正文中的普通文本误命中。
            // 空白 Issue 或无法识别的值使用 fallback。
            const section = body.match(/^###\s*(?:模块|Module)\s*\r?\n+([^\r\n#]+)/m);
            const selected = section ? section[1].trim() : null;
            const matched = selected ? (map.modules.find((entry) => entry.module === selected) ?? null) : null;

            const target = matched ?? map.fallback;
            core.info(`模块匹配：${matched ? matched.module : '无'} → 标签=${target.label} 负责人=${target.owner}`);

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number,
              labels: [target.label],
            });

            try {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number,
                assignees: [target.owner],
              });
            } catch (e) {
              // 负责人失去仓库权限时分配可能失败；保留标签并暴露问题，不让整个任务失败。
              core.warning(`无法分配给 ${target.owner}：${e.message}`);
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number,
                labels: ['needs-triage'],
              });
            }
