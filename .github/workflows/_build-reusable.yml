name: 构建流水线（可复用）

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON 字符串形式的构建矩阵（调用方通过 fromJSON 传入）'
        type: string
        required: true
      ref:
        description: '要检出的 Git ref（留空则使用触发提交）'
        type: string
        default: ''
      skip_code_quality:
        description: '跳过代码质量检查（仅用于加快调试构建）'
        type: boolean
        default: false
      append_commit_hash:
        description: '在产物名称后追加短提交哈希'
        type: boolean
        default: false
      upload_installers_only:
        description: '仅上传主要安装包（exe/msi/dmg/deb），跳过 zip/yml/blockmap'
        type: boolean
        default: false
      tjuaecore_run_id:
        description: '可选的 TjuaeCore 手动构建运行 ID，用其产物替代锁定版本'
        type: string
        default: ''

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  code-quality:
    name: 代码质量
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_code_quality }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行 postinstall
        run: bun run postinstall

      - name: 运行身份与去推广契约
        run: bun run identity:check

      - name: 运行 lint
        run: bun run lint

      - name: 检查格式
        run: bun run format:check

      - name: TypeScript 类型检查
        run: bunx tsc --noEmit

      - name: 检查国际化
        shell: bash
        run: |
          bun run i18n:types
          node scripts/check-i18n.js
          git diff --exit-code

      - name: 运行单元测试
        run: bun run test

  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: code-quality
    if: ${{ always() && (inputs.skip_code_quality || needs.code-quality.result == 'success') }}

    outputs:
      commit-short: ${{ steps.commit.outputs.short }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: 获取提交哈希
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "提交：$SHORT"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 在安装构建依赖前恢复 Electron 与 Electron Builder 缓存。
      - name: 缓存 Electron 产物
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: 缓存状态
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: 安装依赖
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: 运行 postinstall
        run: bun run postinstall

      - name: 安装 MSVC ARM64 工具链（仅 Windows ARM64）
        if: matrix.platform == 'windows-arm64'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          shell: pwsh
          command: |
            choco install visualstudio2022buildtools --yes --params "'--add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --add Microsoft.VisualStudio.Component.Windows11SDK.22000 --includeRecommended --includeOptional'"

      - name: 配置 Windows 构建环境（仅 Windows）
        if: startsWith(matrix.platform, 'windows')
        run: |
          echo "正在设置支持 ConPTY 的 Windows SDK 版本"
          echo "WindowsTargetPlatformVersion=10.0.19041.0" >> $env:GITHUB_ENV

      - name: 配置 MSBuild（仅 Windows）
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: 为 Electron 重建原生模块
        if: "!startsWith(matrix.platform, 'windows')"
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: 输出构建配置
        shell: bash
        run: |
          echo "=========================================="
          echo "构建配置"
          echo "=========================================="
          echo "平台：${{ matrix.platform }}"
          echo "目标架构：${{ matrix.arch }}"
          echo "构建命令：${{ matrix.command }}"
          echo "运行器系统：${{ runner.os }}"
          echo "运行器架构：${{ runner.arch }}"
          echo "引用：${{ inputs.ref || '（默认）' }}"
          echo "提交：${{ steps.commit.outputs.short }}"
          echo "=========================================="

      - name: 安装 Linux 依赖
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: 为 Electron 重建原生模块（Windows）
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        continue-on-error: false
        run: |
          $arch = "${{ matrix.arch }}"
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()
          node scripts/rebuildNativeModules.js `
            --module better-sqlite3 `
            --module-root node_modules/better-sqlite3 `
            --platform win32 `
            --arch $arch `
            --electron-version $electronVer

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "✅ 所有关键原生模块均已通过验证"
          Write-Host "=========================================="
          exit 0
        env:
          npm_config_runtime: electron
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_disturl: https://electronjs.org/headers
          # 不强制从源码构建，先让 prebuild-install 尝试。
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: 准备 tjuaecore 二进制
        shell: bash
        run: node scripts/prepareTjuaeCore.js
        env:
          # 版本由仓库根目录 package.json 中的 tjuaeCoreVersion 固定。
          # 仅临时构建需要覆盖版本时才在这里设置 TJUAEUI_BACKEND_VERSION。
          TJUAEUI_BACKEND_RUN_ID: ${{ inputs.tjuaecore_run_id }}
          TJUAEUI_BACKEND_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: 使用 electron-builder 构建（Windows）
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Command = $env:WINDOWS_BUILD_COMMAND
          Write-Host "正在运行 Windows 构建命令：$Command"
          Invoke-Expression $Command
          if ($LASTEXITCODE -ne 0) {
            Write-Error "${{ matrix.platform }} 构建失败，退出码：$LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Windows 构建成功完成"
        env:
          WINDOWS_BUILD_COMMAND: ${{ matrix.command }}
          TJUAEUI_BACKEND_RUN_ID: ${{ inputs.tjuaecore_run_id }}
          # Node.js 内存限制，防止 Vite 打包时内存不足。
          NODE_OPTIONS: '--max-old-space-size=8192'
          # 目标架构。
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          # 原生模块编译。
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          # Windows 构建参数。
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          _WIN32_WINNT: 0x0A00
          # CI flag & GitHub token / CI 标识与 GitHub Token
          CI: true
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      # 创建 DMG 前清理残留磁盘镜像（仅 macOS）。
      # 清理可能残留的磁盘镜像，避免 hdiutil "Device not configured" 错误
      - name: 清理残留磁盘镜像（仅 macOS）
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "正在清理残留磁盘镜像……"
          # 卸载所有已挂载的磁盘镜像。
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read disk; do
            echo "正在卸载 $disk……"
            hdiutil detach "$disk" -force 2>/dev/null || true
          done
          # 清理临时 DMG 文件。
          rm -f /tmp/*.dmg 2>/dev/null || true
          echo "清理完成"

      # macOS：构建未签名安装包。
      - name: 使用 electron-builder 构建（macOS，未签名）
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: ${{ matrix.command }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          TJUAEUI_BACKEND_RUN_ID: ${{ inputs.tjuaecore_run_id }}
          npm_config_arch: ${{ matrix.arch }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          CI: true
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      # Linux：标准构建，不做特殊错误处理。
      - name: 使用 electron-builder 构建（Linux）
        if: startsWith(matrix.platform, 'linux')
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 60
          command: ${{ matrix.command }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          TJUAEUI_BACKEND_RUN_ID: ${{ inputs.tjuaecore_run_id }}
          npm_config_arch: ${{ matrix.arch }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          CI: true
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      # macOS 钥匙串清理
      # macOS 构建失败通知。
      - name: 报告 macOS 构建失败
        if: startsWith(matrix.platform, 'macos') && failure()
        run: |
          echo "::error title=macOS 构建失败::构建失败，请查看日志了解详情。"
          echo ""
          echo "❌ macOS 构建失败"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "常见原因："
          echo "  • hdiutil/DMG 创建失败（设备未配置）"
          echo "  • 内存不足（OOM）"
          echo ""
          echo "请查看上方构建日志中的具体错误。"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 列出构建产物
        if: success() || failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "构建产物"
          echo "=========================================="
          if [ -d "out" ]; then
            ls -lh out/ || true
            echo "=========================================="
            echo "产物总览："
            find out/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.zip" -o -name "*.yml" \) -exec basename {} \; || true
          else
            echo "未找到 out 目录！"
          fi

      # 验证桌面 asar 没有混入 packages/web-cli/ 代码。
      - name: 验证桌面 asar 隔离
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ASAR=$(find out -type f -name 'app.asar' -not -path '*node_modules*' | head -n 1 || true)
          if [ -z "$ASAR" ]; then
            echo "::notice::未找到 ${{ matrix.platform }} 的 app.asar，跳过隔离检查"
            exit 0
          fi
          echo "正在检查 $ASAR 是否混入 Web CLI 代码……"
          LEAK_COUNT=$(bunx @electron/asar list "$ASAR" 2>/dev/null | grep -cE '^/packages/web-cli(/|$)' || true)
          if [ "$LEAK_COUNT" != "0" ]; then
            echo "::error::桌面端 asar 中发现 $LEAK_COUNT 个 Web CLI 条目："
            bunx @electron/asar list "$ASAR" | grep -E '^/packages/web-cli(/|$)' | head -20
            exit 1
          fi
          echo "✅ asar 隔离验证通过：未发现 packages/web-cli 条目"

      # 仅上传成功构建的安装包产物。
      - name: 清理非安装包产物
        if: inputs.upload_installers_only && success()
        shell: bash
        run: |
          echo "正在从 out/ 删除非安装包文件……"
          rm -f out/*.blockmap out/*.zip out/*.yml out/builder-debug.yml 2>/dev/null || true
          echo "剩余产物："
          ls -lh out/ || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: ${{ inputs.append_commit_hash && format('{0}-{1}', matrix.artifact-name, steps.commit.outputs.short) || matrix.artifact-name }}
          path: |
            out/*.exe
            out/*.msi
            out/*.dmg
            out/*.deb
            out/TjuaeUI-*-mac-*.zip
            out/*.yml
          if-no-files-found: error
          retention-days: 7

  build-summary:
    name: 构建摘要
    runs-on: ubuntu-latest
    needs: [code-quality, build]
    if: always()

    steps:
      - name: 写入构建摘要
        env:
          MATRIX: ${{ inputs.matrix }}
        run: |
          PLATFORMS=$(echo "$MATRIX" | jq -r '[.include[].platform] | join(", ")')

          echo "## 构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 引用 | \`${{ inputs.ref || '（默认）' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 提交 | \`${{ needs.build.outputs.commit-short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | $PLATFORMS |" >> $GITHUB_STEP_SUMMARY
          echo "| 代码质量 | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::至少一个目标平台构建失败"
            exit 1
          fi
          if [ "${{ inputs.skip_code_quality }}" != "true" ] && [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "::error::代码质量门禁失败"
            exit 1
          fi
