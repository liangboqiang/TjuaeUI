name: 打包 Web CLI

on:
  workflow_call:
    inputs:
      ref:
        description: '要检出的 Git ref（留空则使用触发提交）'
        type: string
        default: ''
      append_commit_hash:
        description: '在产物名称后追加短提交哈希'
        type: boolean
        default: false
      skip_code_quality:
        description: '跳过代码质量检查（调用方已执行）'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: '要检出的 Git ref（留空则使用触发提交）'
        type: string
        default: ''
      skip_code_quality:
        description: '跳过代码质量检查'
        type: boolean
        default: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  code-quality:
    name: 代码质量
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_code_quality }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行 postinstall
        run: bun run postinstall

      - name: 运行身份与去推广契约
        run: bun run identity:check

      - name: 运行 lint
        run: bun run lint

      - name: 检查格式
        run: bun run format:check

      - name: TypeScript 类型检查
        run: bunx tsc --noEmit

      - name: 检查国际化
        shell: bash
        run: |
          bun run i18n:types
          node scripts/check-i18n.js
          git diff --exit-code

      - name: 运行单元测试
        run: bun run test

  pack-web-cli:
    name: 打包 web-cli ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: code-quality
    if: ${{ always() && (inputs.skip_code_quality || needs.code-quality.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64, os: macos-14 }
          - { platform: darwin, arch: x64, os: macos-14 }
          - { platform: linux, arch: x64, os: ubuntu-latest }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
          - { platform: win32, arch: x64, os: windows-2022 }

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: 获取提交哈希
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建桌面渲染进程（生成静态文件）
        run: bunx electron-vite build --config packages/desktop/electron.vite.config.ts
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: 打包 web-cli 压缩包
        shell: bash
        run: node scripts/pack-web-cli.js
        env:
          PACK_PLATFORM: ${{ matrix.platform }}
          PACK_ARCH: ${{ matrix.arch }}
          # 版本由仓库根目录 package.json 中的 tjuaeCoreVersion 固定。
          GH_TOKEN: ${{ github.token }}

      - name: 上传压缩包产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.append_commit_hash && format('web-cli-{0}-{1}-{2}', matrix.platform, matrix.arch, steps.commit.outputs.short) || format('web-cli-{0}-{1}', matrix.platform, matrix.arch) }}
          path: |
            dist-web-cli/*.tar.gz
            dist-web-cli/*.sha256
          retention-days: 7

  prepare-install-script:
    name: 准备发布版 install-web.sh
    runs-on: ubuntu-latest
    needs: pack-web-cli
    if: ${{ always() && needs.pack-web-cli.result == 'success' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: 获取提交哈希
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 从 package.json 获取版本
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 替换 install-web.sh 中的版本占位符
        run: |
          mkdir -p dist-scripts
          sed "s/__VERSION__/${{ steps.version.outputs.version }}/g" scripts/install-web.sh > dist-scripts/install-web.sh
          chmod +x dist-scripts/install-web.sh

      - name: 上传 install-web.sh 产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.append_commit_hash && format('install-web-script-{0}', steps.commit.outputs.short) || 'install-web-script' }}
          path: dist-scripts/install-web.sh
          retention-days: 7

  smoke-test:
    name: 冒烟测试 web-cli 压缩包（Linux x86_64）
    runs-on: ubuntu-latest
    needs: pack-web-cli
    if: ${{ always() && needs.pack-web-cli.result == 'success' }}
    container:
      image: debian:bookworm-slim

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y curl tar gzip nodejs

      - name: 下载 Linux x86_64 压缩包
        uses: actions/download-artifact@v7
        with:
          name: web-cli-linux-x64
          path: dist-web-cli

      - name: 运行冒烟测试
        shell: bash
        run: |
          chmod +x scripts/smoke-test-web-cli.sh
          TARBALL=$(ls dist-web-cli/*.tar.gz | head -1)
          bash scripts/smoke-test-web-cli.sh "$TARBALL"

  smoke-test-install:
    name: 冒烟测试 install-web.sh（Linux x86_64）
    runs-on: ubuntu-latest
    needs: [pack-web-cli, prepare-install-script]
    if: ${{ always() && needs.pack-web-cli.result == 'success' && needs.prepare-install-script.result == 'success' }}
    container:
      image: debian:bookworm-slim

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y curl tar gzip nodejs coreutils

      - name: 解析版本
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "解析后的版本：$VERSION"

      - name: 下载 Linux x86_64 压缩包
        uses: actions/download-artifact@v7
        with:
          name: web-cli-linux-x64
          path: /tmp/releases/v${{ steps.version.outputs.version }}

      - name: 下载 install-web.sh
        uses: actions/download-artifact@v7
        with:
          name: install-web-script
          path: /tmp/releases

      - name: 运行冒烟测试
        shell: bash
        run: |
          chmod +x scripts/smoke-test-install-web.sh
          bash scripts/smoke-test-install-web.sh file:///tmp/releases ${{ steps.version.outputs.version }}
