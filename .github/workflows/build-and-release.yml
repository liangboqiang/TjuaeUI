name: 发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  code-quality:
    name: 发布前质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出标签源码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 验证标签与包版本一致
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: 安装锁定依赖
        run: bun install --frozen-lockfile

      - name: 执行安装后准备
        run: bun run postinstall

      - name: 运行身份与去推广契约
        run: bun run identity:check

      - name: 运行静态检查
        run: bun run lint -- --quiet

      - name: 检查格式
        run: bun run format:check

      - name: 检查 TypeScript 类型
        run: bunx tsc --noEmit

      - name: 检查国际化
        shell: bash
        run: |
          bun run i18n:types
          node scripts/check-i18n.js
          git diff --exit-code

      - name: 运行全部测试
        run: bun run test

  build-desktop:
    name: 构建六平台桌面安装包
    needs: code-quality
    uses: ./.github/workflows/_build-reusable.yml
    with:
      skip_code_quality: true
      require_distribution_signing: false
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},
          {"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"},
          {"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"},
          {"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}
        ]}
    secrets: inherit

  build-web-cli:
    name: 构建五平台 Web CLI
    needs: code-quality
    uses: ./.github/workflows/pack-web-cli.yml
    with:
      ref: ''
      append_commit_hash: false
      skip_code_quality: true
    secrets: inherit

  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-desktop
      - build-web-cli
    steps:
      - name: 检出标签源码
        uses: actions/checkout@v6

      - name: 下载全部构建产物
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: 规范化并验证发布资产
        shell: bash
        run: |
          bash scripts/prepare-release-assets.sh build-artifacts release-assets
          bash scripts/verify-release-assets.sh release-assets

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "未找到可发布资产"
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes
          fi
