name: 'PR 检查'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '要运行检查的 PR 编号'
        required: true
        type: string
      skip_build_test:
        description: '跳过构建测试任务（约节省 45 分钟）'
        type: boolean
        required: false
        default: false
  pull_request:
    types: [opened, synchronize, edited, closed, ready_for_review]
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: write

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # PR 合并或手动关闭时，取消仍在运行的检查。
  cancel-if-closed:
    name: PR 关闭时取消
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR 已关闭，通过 concurrency 取消正在运行的任务。"

  # 任务 1：代码质量检查（TypeScript、Oxlint、Oxfmt）。
  code-quality:
    name: 代码质量
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析 PR 上下文
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ github.token }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行 postinstall
        run: bun run postinstall

      - name: 安装 prek
        run: npm install -g @j178/prek

      - name: 运行 prek 检查
        run: prek run --from-ref origin/${{ env.PR_BASE_REF }} --to-ref HEAD

  # 任务 2：全平台单元测试。
  unit-tests:
    name: 单元测试（${{ matrix.os }}）
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析 PR 上下文
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ github.token }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: 禁用 Windows Defender（仅 Windows）
        if: matrix.os == 'windows-2022'
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Host "::warning::禁用实时监控失败：$_" }
          try { Add-MpPreference -ExclusionPath "${{ github.workspace }}" } catch { Write-Host "::warning::添加排除路径失败：$_" }

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行 postinstall
        run: bun run postinstall

      - name: 运行扩展系统测试
        run: bunx vitest run

  # 任务 3：覆盖率测试（仅 Linux）。
  coverage-tests:
    name: 覆盖率测试
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析 PR 上下文
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ github.token }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行 postinstall
        run: bun run postinstall

      - name: 运行覆盖率测试
        id: coverage
        run: bun run test:coverage

      - name: 覆盖率结果摘要
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.coverage.outcome }}" = "failure" ]; then
            echo "## 覆盖率检查失败" >> $GITHUB_STEP_SUMMARY
            echo "本次覆盖率命令失败；该任务将阻断合并。" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 覆盖率检查" >> $GITHUB_STEP_SUMMARY
            echo "覆盖率命令已通过，报告仅保存在本次工作流产物中。" >> $GITHUB_STEP_SUMMARY
            if [ -f coverage/lcov.info ]; then
              echo "已生成 lcov.info。" >> $GITHUB_STEP_SUMMARY
            else
              echo "覆盖率检查通过，但未生成 lcov.info。" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: 上传覆盖率产物
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-local
          path: coverage/
          if-no-files-found: warn

  i18n-check:
    name: i18n 检查
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行 postinstall
        run: bun run postinstall

      - name: 运行 i18n 验证（仅警告）
        id: i18n
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-i18n.js 2>&1 | tee i18n-check.log

      - name: 发布 i18n 摘要
        if: always()
        shell: bash
        run: |
          echo "## 国际化验证" >> $GITHUB_STEP_SUMMARY
          if grep -q "⚠️" i18n-check.log; then
            echo "发现缺失或不完整的翻译，请查看下方警告。" >> $GITHUB_STEP_SUMMARY
          else
            echo "未发现国际化警告。" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>国际化日志</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat i18n-check.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

  # 任务 4：在代表性平台执行构建测试，与代码质量和单元测试并行。
  build-test:
    name: 构建测试（${{ matrix.platform }}）
    if: github.event.action != 'closed' && github.event.pull_request.draft == false && inputs.skip_build_test != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-arm64'
            os: 'macos-14'
            arch: 'arm64'
            target: '--mac'
            build_args: '--mac --arm64'
            unpacked_dir: 'mac-arm64'
          - platform: 'windows-x64'
            os: 'windows-2022'
            arch: 'x64'
            target: '--win'
            build_args: '--win --x64'
            unpacked_dir: 'win-unpacked'
          - platform: 'linux-x64'
            os: 'ubuntu-latest'
            arch: 'x64'
            target: '--linux'
            build_args: '--linux --x64'
            unpacked_dir: 'linux-unpacked'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行 postinstall
        run: bun run postinstall

      - name: 安装 Linux 依赖
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: 获取 Electron 版本
        id: electron-version
        shell: bash
        run: |
          ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')")
          echo "version=$ELECTRON_VERSION" >> $GITHUB_OUTPUT
          echo "Electron 版本：$ELECTRON_VERSION"

      # 在运行 install-app-deps 前恢复 Electron 与 Electron Builder 缓存。
      - name: 缓存 Electron 产物
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: 缓存状态
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: 为 Electron 重建原生模块（非 Windows）
        if: "!startsWith(matrix.platform, 'windows')"
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: 配置 MSBuild（仅 Windows）
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: 构建测试（Windows x64）
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "构建测试：${{ matrix.platform }}"
          Write-Host "=========================================="
          node scripts/build-with-builder.js x64 --win --x64
          Write-Host "✓ ${{ matrix.platform }} 构建测试通过"
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_runtime: electron
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          CI: true
          GH_TOKEN: ${{ github.token }}

      - name: 构建测试（非 Windows）
        if: "!startsWith(matrix.platform, 'windows')"
        shell: bash
        run: |
          echo "=========================================="
          echo "构建测试：${{ matrix.platform }}"
          echo "=========================================="
          node scripts/build-with-builder.js auto ${{ matrix.build_args }}
          echo "✓ ${{ matrix.platform }} 构建测试通过"
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_runtime: electron
          npm_config_target: ${{ steps.electron-version.outputs.version }}
          npm_config_disturl: https://electronjs.org/headers
          CI: true
          GH_TOKEN: ${{ github.token }}

      - name: 验证构建产物存在
        shell: bash
        run: |
          echo "=========================================="
          echo "验证构建产物：${{ matrix.platform }}"
          echo "=========================================="
          ls -lah out || true

          case "${{ matrix.platform }}" in
            windows-*)
              ls out/*.exe out/*latest*.yml >/dev/null
              ;;
            macos-*)
              ls out/*.dmg out/*.zip out/*latest*.yml >/dev/null
              ;;
            linux-x64)
              ls out/*.deb out/*latest*.yml >/dev/null
              ;;
          esac

      - name: 静默安装冒烟测试（Windows x64）
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "安装冒烟测试：windows-x64"
          Write-Host "=========================================="

          $installer = Get-ChildItem -Path out -Filter "TjuaeUI-*-win-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "在 out/ 中未找到 Windows 安装包"
          }

          Write-Host "使用安装包：$($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -NoNewWindow

          $candidates = @(
            "$env:LOCALAPPDATA\\Programs\\TjuaeUI\\TjuaeUI.exe",
            "$env:ProgramFiles\\TjuaeUI\\TjuaeUI.exe",
            "$env:ProgramFiles(x86)\\TjuaeUI\\TjuaeUI.exe"
          )

          $installedExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installedExe) {
            throw "静默安装已完成，但未在预期位置找到应用程序可执行文件"
          }

          Write-Host "已安装的可执行文件：$installedExe"

      - name: 安装冒烟测试（macOS arm64）
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "安装冒烟测试：macos-arm64"
          echo "=========================================="

          DMG_FILE=$(ls out/*.dmg | head -n 1)
          MOUNT_POINT="/tmp/tjuaeui-smoke-mount"
          APP_DIR="/tmp/tjuaeui-smoke-app"

          rm -rf "$MOUNT_POINT" "$APP_DIR"
          mkdir -p "$MOUNT_POINT" "$APP_DIR"

          hdiutil attach "$DMG_FILE" -nobrowse -mountpoint "$MOUNT_POINT"
          cp -R "$MOUNT_POINT"/*.app "$APP_DIR"/
          hdiutil detach "$MOUNT_POINT"

          APP_PATH=$(ls -d "$APP_DIR"/*.app | head -n 1)
          APP_BIN="$APP_PATH/Contents/MacOS/TjuaeUI"

          test -x "$APP_BIN"
          "$APP_BIN" --version || true

      - name: 安装冒烟测试（Linux）
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "安装冒烟测试：linux-x64"
          echo "=========================================="

          DEB_FILE=$(ls out/*.deb | head -n 1)
          PKG_NAME=$(dpkg-deb -f "$DEB_FILE" Package)
          sudo dpkg -i "$DEB_FILE" || sudo apt-get install -f -y

          INSTALLED_BIN=$(dpkg -L "$PKG_NAME" | grep -Ei '/(bin|opt)/.*(tjuaeui)$' | head -n 1 || true)
          if [ -z "$INSTALLED_BIN" ]; then
            echo "软件包文件："
            dpkg -L "$PKG_NAME" | head -n 50
            echo "没有已安装的可执行文件路径匹配预期模式"
            exit 1
          fi

          test -x "$INSTALLED_BIN"

  # 任务 5：测试发布脚本（速度快，无需构建）。
  release-script-test:
    name: 发布脚本测试
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 创建模拟构建产物
        shell: bash
        run: bash scripts/create-mock-release-artifacts.sh build-artifacts

      - name: 运行 prepare-release-assets 脚本
        shell: bash
        env:
          MOCK_VERSION: '1.0.0'
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: 验证脚本输出
        shell: bash
        run: bash scripts/verify-release-assets.sh release-assets 1.0.0
